<title>Congresso de Psicologia do Esporte | Atleta Campeão</title>
<script>
/* Teste A/B da página de venda das aulas gravadas de Psicologia do Esporte.
   Sorteia 50/50 entre as versões A e B e mantém o mesmo sorteio para quem volta.
   Preserva UTMs, fbclid e demais parâmetros e acrescenta variante=a|b.
   Para forçar uma versão: ?variante=a ou ?variante=b.
   Sem Pixel/GTM aqui para não contar PageView em dobro (as versões A e B têm os seus). */
(function(){
  var KEY="lp_psi_gravado_variante", v=null;
  var q=new URLSearchParams(location.search);
  var f=q.get("variante"); if(f==="a"||f==="b") v=f;
  if(!v){try{v=localStorage.getItem(KEY)}catch(e){}}
  if(v!=="a"&&v!=="b"){var r;try{r=crypto.getRandomValues(new Uint32Array(1))[0]/4294967296}catch(e){r=Math.random()}v=r<0.5?"a":"b"}
  try{localStorage.setItem(KEY,v)}catch(e){}
  q.set("variante",v);
  location.replace("/congresso-psicologia-gravado-"+v+"/?"+q.toString()+location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/congresso-psicologia-gravado-a/?variante=a"></noscript>
